name: serene_setup
description: "Serene kurulum ve kaldirma uygulamasi (ozel Flutter arayuzu)."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  # Yazi tipleri uygulamayla ayni dosyalardir (flutter_app/assets/fonts).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
