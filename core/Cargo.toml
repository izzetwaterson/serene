[package]
name = "serene-core"
version = "0.1.0"
description = "Serene indirme motoru - arayuzden bagimsiz cekirdek"
authors = ["izzet"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "serene_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
] }
tokio-util = "0.7"
futures-util = "0.3"

reqwest = { version = "0.12", features = ["stream", "gzip", "brotli", "deflate"] }

uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
arboard = "3"
percent-encoding = "2"
anyhow = "1"
m3u8-rs = "6.0.1"
quick-xml = "0.42"
aes = "0.8.4"
cbc = "0.1.2"
hex = "0.4.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
